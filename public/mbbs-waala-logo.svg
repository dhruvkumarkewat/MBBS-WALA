<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" fill="none" role="img" aria-label="MBBS Wala">
  <!-- Official-style mark: stethoscope + chat hearts over wordmark -->
  <g transform="translate(200,4)">
    <!-- ear tubes -->
    <path d="M40 92 C40 40 88 12 120 12 C152 12 200 40 200 92" stroke="#1E88E5" stroke-width="14" stroke-linecap="round" fill="none"/>
    <circle cx="40" cy="92" r="13" fill="#1E88E5"/>
    <circle cx="40" cy="92" r="5" fill="#fff"/>
    <circle cx="200" cy="92" r="13" fill="#1E88E5"/>
    <circle cx="200" cy="92" r="5" fill="#fff"/>
    <!-- tubing -->
    <path d="M120 92 C120 128 96 150 72 164 C56 174 40 180 28 184" stroke="#1E88E5" stroke-width="12" stroke-linecap="round" fill="none"/>
    <circle cx="26" cy="186" r="10" fill="#1E88E5"/>
    <!-- chat bubbles -->
    <rect x="96" y="0" width="52" height="36" rx="10" fill="#E91E63"/>
    <path d="M112 36 L124 36 L116 48 Z" fill="#E91E63"/>
    <rect x="122" y="14" width="46" height="32" rx="10" fill="#C2185B"/>
    <path d="M148 46 L160 46 L154 56 Z" fill="#C2185B"/>
    <!-- heart + pulse -->
    <path d="M114 10 C114 6 117 3 121 3 C124 3 126 5 127 7 C128 5 130 3 133 3 C137 3 140 6 140 10 C140 17 127 26 127 26 C127 26 114 17 114 10 Z" fill="#fff"/>
    <path d="M119 15 H123 L126 10 L129 22 L132 14 H137" stroke="#E91E63" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- Wordmark -->
  <text x="24" y="168" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-size="72" font-weight="900" fill="#1E88E5" letter-spacing="-2">MBBS</text>
  <text x="250" y="168" font-family="Arial Black, Helvetica Neue, Arial, sans-serif" font-size="72" font-weight="900" fill="#E91E63" letter-spacing="-2">Wala</text>
</svg>
